name: Cornerstone Building Brands Regulatory Posture
description: >-
  Harvest-only record of horizontal regulatory signals. Two are published: a privacy policy statement that
  a browser-based Global Privacy Control signal is honored as an opt-out of cookie-based sales and sharing,
  and a data-subject request web form covering correction, deletion, access, opt-out, appeal and Canadian
  requests. Nothing else in the signal list is published: no accessibility conformance report, no
  subprocessor list, no DPA, no SBOM, no support-lifetime statement, no data-residency documentation, no
  transparency report, no AI disclosure. The company is a building-products manufacturer, not a software
  vendor, so most of these regimes reach it (if at all) through its website and customer portal rather than
  a product. The 2025 Corporate Governance & Responsibility report (PDF) is an ESG document, not any of the
  signals above, and is deliberately not recorded as one.
signals:
  global_privacy_control:
    honored: true
    url: https://www.cornerstonebuildingbrands.com/privacy-policy
    statement: >-
      "If you choose to use a browser-based opt-out signal, such as the Global Privacy Control (GPC), you
      will be opted out of cookie-based sales and sharing of personal information, and will need to turn it
      on for each browser you use."
    source_note: Published statement in the Privacy Policy (Last Updated November 7, 2025); NOT tested by sending a Sec-GPC header.
  data_subject_request:
    url: https://www.cornerstonebuildingbrands.com/privacy-request-form
    request_types:
    - Request to Correct
    - Request to Delete
    - Opt Out of Offline Sales/Sharing/Shine the Light Opt Out
    - Request to Know Categories of Personal Information (California)
    - Request to Know Specific Pieces of Personal Information (California)
    - Access Request (US - Non-CA)
    - Request info about data disclosed to third parties (CT, DE, MD, MN, OR)
    - Access Request (Canada)
    - Appeal a Denial of a Prior Request (US - Non-California)
    - Obtain Info about Service Providers (Canada)
    note: Web form only; no API endpoint is documented.
