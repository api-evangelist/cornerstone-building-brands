components:
  responses:
    rest_invalid_param:
      description: Invalid parameter (WordPress REST error envelope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WPError'
    rest_forbidden:
      description: Not allowed without credentials (WordPress REST error envelope, code rest_forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WPError'
    rest_not_found:
      description: No item with that id (code rest_post_invalid_id / rest_term_invalid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WPError'
  schemas:
    WPError:
      type: object
      description: Standard WordPress REST API error envelope.
      properties:
        code:
          type: string
          examples:
          - rest_forbidden
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
          additionalProperties: true
      required:
      - code
      - message
