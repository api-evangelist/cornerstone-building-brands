openapi: 3.1.0
info:
  title: Cornerstone Building Brands Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Anonymously readable content surface of www.cornerstonebuildingbrands.com: news releases, industry pages, leadership
    profiles, pages, posts, media, taxonomies and site search.'
  description: 'Cornerstone Building Brands publishes www.cornerstonebuildingbrands.com on WordPress (WP Engine), which exposes
    the WordPress REST API at https://www.cornerstonebuildingbrands.com/wp-json/. This document was DERIVED by the API Evangelist
    enrichment pipeline from the provider''s own self-describing route index (GET /wp-json/, HTTP 200, 369 routes, fetched
    2026-09-19): every path, method, parameter name, type, enum, default and description below is copied from that index,
    and every collection was confirmed to answer an anonymous GET with HTTP 200 on 2026-09-19. It covers ONLY the anonymously
    readable read surface; routes that answered 401 without credentials (settings, menus, menu-items, block-types, users/me,
    the mcp namespace and wp-abilities/v1) are deliberately excluded. Cornerstone Building Brands publishes no OpenAPI of
    its own and no developer program; this is the WordPress platform contract wearing the company''s domain, not a product
    API. Custom post types news, industry and leadership and the news_category / news_solution taxonomies are the company-specific
    parts of the surface.'
  contact:
    name: Cornerstone Building Brands, Inc.
    url: https://www.cornerstonebuildingbrands.com/contact-us
  termsOfService: https://www.cornerstonebuildingbrands.com/legal
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://www.cornerstonebuildingbrands.com/wp-json/
  x-derived-on: '2026-09-19'
  x-provider-published: false
  x-generated-from: wordpress-rest-route-index
servers:
- url: https://www.cornerstonebuildingbrands.com/wp-json
  description: Production (WordPress REST API root; anonymous read access)
tags:
- name: Posts
  description: Blog posts published on the corporate site (the wp/v2 posts collection).
- name: Pages
  description: Corporate, customer-solutions, legal and privacy pages of cornerstonebuildingbrands.com.
- name: Media
  description: Media library items (product and campaign imagery, uploaded PDFs such as the annual Corporate Governance &
    Responsibility report).
- name: News
  description: Press releases and news updates (custom post type `news`), classified by news_category and news_solution.
- name: Industry
  description: Industry / market-segment pages (custom post type `industry`, e.g. Storage, Agriculture).
- name: Leadership
  description: Leadership-team profiles (custom post type `leadership`).
- name: Categories
  description: Post categories.
- name: Tags
  description: Post tags.
- name: News Categories
  description: News categories taxonomy (`news_category`).
- name: News Solutions
  description: News solution taxonomy (`news_solution`), mapping news items to product solutions.
- name: Search
  description: Site-wide search across public content.
- name: Taxonomies
  description: Registered taxonomies.
- name: Types
  description: Registered post types.
- name: Statuses
  description: Registered post statuses.
paths:
  /wp/v2/posts:
    get:
      operationId: listPosts
      summary: List posts
      description: Blog posts published on the corporate site (the wp/v2 posts collection). Anonymous GET; the response carries
        X-WP-Total and X-WP-TotalPages headers and an RFC 8288 Link header for pagination.
      tags:
      - Posts
      parameters:
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Current page of the collection.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        description: Maximum number of items to be returned in result set.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Limit results to those matching a string.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Limit response to posts published after a given ISO8601 compliant date.
      - name: modified_after
        in: query
        required: false
        schema:
          type: string
        description: Limit response to posts modified after a given ISO8601 compliant date.
      - name: author
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Limit result set to posts assigned to specific authors.
      - name: author_exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Ensure result set excludes posts assigned to specific authors.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Limit response to posts published before a given ISO8601 compliant date.
      - name: modified_before
        in: query
        required: false
        schema:
          type: string
        description: Limit response to posts modified before a given ISO8601 compliant date.
      - name: exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Ensure result set excludes specific IDs.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Limit result set to specific IDs.
      - name: search_semantics
        in: query
        required: false
        schema:
          type: string
          enum:
          - exact
        description: How to interpret the search input.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Offset the result set by a specific number of items.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Order sort attribute ascending or descending.
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
        description: Sort collection by post attribute.
      - name: search_columns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - post_title
            - post_content
            - post_excerpt
        description: Array of column names to be searched.
      - name: slug
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Limit result set to posts with one or more specific slugs.
      - name: status
        in: query
        required: false
        schema:
          type: array
          default: publish
          items:
            type: string
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - acf-disabled
            - any
        description: Limit result set to posts assigned one or more statuses.
      - name: tax_relation
        in: query
        required: false
        schema:
          type: string
          enum:
          - AND
          - OR
        description: Limit result set based on relationship between multiple taxonomies.
      - name: categories
        in: query
        required: false
        schema:
          type: object
          additionalProperties: true
        description: Limit result set to items with specific terms assigned in the categories taxonomy.
      - name: categories_exclude
        in: query
        required: false
        schema:
          type: object
          additionalProperties: true
        description: Limit result set to items except those with specific terms assigned in the categories taxonomy.
      - name: tags
        in: query
        required: false
        schema:
          type: object
          additionalProperties: true
        description: Limit result set to items with specific terms assigned in the tags taxonomy.
      - name: tags_exclude
        in: query
        required: false
        schema:
          type: object
          additionalProperties: true
        description: Limit result set to items except those with specific terms assigned in the tags taxonomy.
      - name: sticky
        in: query
        required: false
        schema:
          type: boolean
        description: Limit result set to items that are sticky.
      - name: ignore_sticky
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Whether to ignore sticky posts or not.
      - name: format
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - standard
            - aside
            - chat
            - gallery
            - link
            - image
            - quote
            - status
            - video
            - audio
        description: Limit result set to items assigned one or more given formats.
      responses:
        '200':
          description: OK
          headers:
            X-WP-Total:
              schema:
                type: integer
              description: Total items matching the query.
            X-WP-TotalPages:
              schema:
                type: integer
              description: Total pages at the requested per_page.
            Link:
              schema:
                type: string
              description: RFC 8288 next/prev links.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/rest_invalid_param'
        '401':
          $ref: '#/components/responses/rest_forbidden'
  /wp/v2/posts/{id}:
    get:
      operationId: getPost
      summary: Retrieve a post
      description: Retrieve a single post by id. Anonymous GET.
      tags:
