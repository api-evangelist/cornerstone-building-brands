  - aid: cornerstone-building-brands:cornerstone-building-brands-mcp
    name: Cornerstone Building Brands MCP Server (WordPress MCP Adapter)
    description: >-
      A live remote Model Context Protocol server served from the corporate WordPress estate under the
      `mcp` REST namespace. Two MCP routes are advertised in the route index — mcp-oauth-server and
      mcp-adapter-default-server — and www.cornerstonebuildingbrands.com publishes both RFC 8414
      OAuth authorization-server metadata and RFC 9728 protected-resource metadata naming mcp-oauth-server
      as the protected resource. Authorization is OAuth 2.1 authorization-code with PKCE (S256), a single
      `mcp` scope, public clients (token_endpoint_auth_method none) and client-ID metadata documents; there
      is no dynamic client registration (/oauth/register 404s). The live tool set could not be enumerated:
      anonymous initialize and tools/list both return HTTP 401 (mcp_unauthorized on the OAuth server,
      rest_forbidden on the default adapter server), as does the wp-abilities/v1 registry that backs the
      tools. The server is platform-authored — the WordPress MCP Adapter running under the company's
      domain — not a Cornerstone-authored tool surface.
    tags:
      - MCP
      - Agents
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
