description: >-
  Cornerstone Building Brands, Inc. is a Fortune 1000 manufacturer of exterior building products in North
  America — vinyl siding and accessories, metal and rainware, fence and railing, windows and entry doors,
  and metal roofs, walls and buildings — sold under brands including Ply Gem, Simonton and Mastic through
  dealers, distributors and builders rather than as software. It operates no developer program and
  publishes no API documentation, SDK or developer portal: the hosts its earlier catalog record named,
  developer.cornerstonebuildingbrands.com and api.cornerstonebuildingbrands.com, do not resolve. Its
  machine-readable surface is what the corporate WordPress estate on www.cornerstonebuildingbrands.com
  exposes — an anonymously readable WordPress REST content API (press releases, industry pages, leadership
  profiles, pages, media, taxonomies and search) and, notably for a manufacturer, a live remote Model
  Context Protocol server published through the WordPress MCP Adapter, advertised by real RFC 8414
  authorization-server metadata and RFC 9728 protected-resource metadata, with tools/list OAuth-gated. The
  company's partner-facing integration surface — orders, ASNs, warranty claims — sits behind the Windows &
  Doors Customer Portal, which signs in with Microsoft Entra ID over an Azure API Management gateway whose
  developer portal is unpublished.
