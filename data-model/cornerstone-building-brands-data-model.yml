description: >-
  The entity graph of the WordPress content core behind www.cornerstonebuildingbrands.com, derived from the
  route index the OpenAPI was built from and from the field sets observed in live anonymous responses. It
  is a CMS content model — post, page, media, term — extended with three company-specific custom post types
  (news, industry, leadership) and two company-specific taxonomies (news_category, news_solution). Note what
  is NOT here: no Product, SKU, Order, Shipment, ASN, WarrantyClaim, Dealer or Distributor entity exists on
  the public surface. Those live behind the Customer Portal login and its Azure API Management backend, so
  the objects an integrator would actually want — orders, ASNs, warranty requests, product catalog — are not
  modellable from anything public.
