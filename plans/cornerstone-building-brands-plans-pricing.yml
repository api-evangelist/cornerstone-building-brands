description: >-
  Cornerstone Building Brands publishes no API plans, no API pricing and no developer program. It is a
  building-products manufacturer; its products are sold through dealers and distributors, and its only
  machine-readable surfaces are the corporate site's WordPress REST content API (anonymous, unmetered, no
  registration) and an OAuth-gated WordPress MCP server on the same host. Access to the Windows & Doors
  Customer Portal — the nearest thing to a partner integration surface — is granted by a request form
  routed to a Territory Sales Manager, with no published terms, tiers or price.
